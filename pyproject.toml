[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-gpt-developer-suite"
version = "0.2.0"
description = "Security-first open-source AI agent developer toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "jouseph36"}]

[project.scripts]
nextgpt = "nextgpt.cli:main"

[tool.setuptools.packages.find]
include = ["nextgpt*"]
